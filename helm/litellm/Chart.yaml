apiVersion: v2
name: litellm
description: Deploys LiteLLM from one image, either componentized (gateway, UI backend, and UI as separate Deployments) or as a single monolith Deployment
type: application
version: 1.0.0
appVersion: "1.104.0"
annotations:
  org.opencontainers.image.source: "https://github.com/BerriAI/litellm"
dependencies:
  - name: postgresql
    version: 14.3.1
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: redis
    version: 18.19.1
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
