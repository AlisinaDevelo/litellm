{{- if .Values.postgresql.enabled }}
{{- include "litellm.validateBundledPostgresImageTag" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litellm.postgresql.credentialsSecretName" . }}
  labels:
    {{- include "litellm.commonLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.postgresql.auth.username | required "postgresql.auth.username is required when postgresql.enabled is true" | b64enc }}
  password: {{ .Values.postgresql.auth.password | required "postgresql.auth.password is required when postgresql.enabled is true" | b64enc }}
{{- end }}
