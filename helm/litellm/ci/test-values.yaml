# Values for the CircleCI helm_chart_testing job: a monolith install on a
# kind cluster from the image built by the pipeline (image.repository / tag /
# pullPolicy are passed with --set), backed by the bundled PostgreSQL so the
# migrations Job and the proxy have a database to talk to.
monolith:
  enabled: true

masterKey:
  secretName: ""
  generate: true

gateway:
  replicaCount: 1
  hpa:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  config:
    create: true
    proxy_config:
      general_settings: {}

postgresql:
  enabled: true
  auth:
    # CI only: a throwaway password for the ephemeral kind cluster
    password: litellm-ci
  primary:
    persistence:
      enabled: false
    resourcesPreset: none
